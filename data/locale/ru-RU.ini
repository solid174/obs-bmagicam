Wizard.Prepare.Title="Подготовьте iPhone"
Wizard.Prepare.Steps="1. Установите Blackmagic Camera из App Store и откройте её.\n2. Включите в ней HTTP-сервер: нажмите Settings, затем HTTP Server и включите Enable HTTP Server.\n3. Когда iOS спросит, разрешите Blackmagic Camera находить устройства в локальной сети.\n4. Не убирайте приложение с экрана во время трансляции. С зарядкой телефон выдержит долгий эфир."
