Camera.Port="UDP-порт"
Camera.Port.Tooltip="Порт этого компьютера, на который телефон отправляет поток. 0 выбирает свободный, начиная с 9710; каждой камере iPhone нужен свой."
Camera.Latency="Задержка SRT"
Camera.Latency.Tooltip="Сколько поток ждёт повторной доставки потерянных пакетов. Увеличьте, если картинка рассыпается на загруженном Wi-Fi; уменьшите, чтобы сократить задержку."
Camera.HardwareDecoding="Аппаратное декодирование"
Camera.HardwareDecoding.Tooltip="Декодирует видео на видеокарте и разгружает процессор. Отключайте, только если в картинке появляются ошибки."
Camera.Address="Адрес iPhone"
Camera.Address.Tooltip="IP-адрес телефона в сети, например 192.168.1.23. iPhone показывает его в Настройки → Wi-Fi → ⓘ рядом с сетью."
Camera.Preset="Пресет потока"
Camera.Preset.Tooltip="Задаёт формат видео камеры и качество потока одним выбором. Заодно меняет формат записи на самом телефоне."
Preset.1080p60High="лучший для большинства трансляций"
Preset.1080p60Balanced="для загруженного Wi-Fi"
Preset.1080p30="для слабого Wi-Fi"
Preset.720p60="самый лёгкий, для самой слабой связи"
Preset.4K30="чётче; задержка примерно на 0,2 с больше; нужен хороший Wi-Fi 5 ГГц и аппаратное декодирование HEVC"
Preset.4K60="максимально чётко; задержка примерно на 0,2 с больше; нужен хороший Wi-Fi 5 ГГц и аппаратное декодирование HEVC"
