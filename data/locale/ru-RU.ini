Beautify.Name="Ретушь кожи"
Beautify.Style="Набор"
Beautify.Style.Tooltip="Набор всех расширенных значений: «Естественный» оставляет кожу настоящей, «Мягкий» сглаживает сильнее и добавляет немного сияния, «Гламур» — самый сильный. Ползунок «Красота» задаёт, насколько сильно он применяется."
Beautify.Style.natural="Естественный"
Beautify.Style.soft="Мягкий"
Beautify.Style.glam="Гламур"
Beautify.Style.Custom="Свой"
Beautify.Strength="Красота"
Beautify.Strength.Tooltip="Насколько сильно набор применяется к коже. Первая половина ползунка остаётся естественной, в конце набор действует полностью. 0 выключает ретушь, и картинка остаётся в точности такой, как была."
Beautify.Advanced="Расширенные настройки"
Beautify.Advanced.Tooltip="Показывает значения, из которых состоит набор. Если изменить одно из них, набор станет «Свой»; «Сохранить как набор» его сохранит."
Beautify.Smoothing="Сглаживание"
Beautify.Smoothing.Tooltip="Выравнивает мелкие неровности кожи: поры, морщинки, несовершенства. Крупные детали — ресницы, ноздри, контур губ — остаются."
Beautify.Texture="Текстура"
Beautify.Texture.Tooltip="Сохраняет самую мелкую фактуру на сглаженной коже, чтобы она не выглядела пластиковой. Чем больше, тем больше фактуры остаётся."
Beautify.Evening="Выравнивание тона"
Beautify.Evening.Tooltip="Осветляет мелкие тёмные пятна и выравнивает покраснения по цвету окружающей кожи."
Beautify.Sharpen="Резкость"
Beautify.Sharpen.Tooltip="Повышает резкость всего, что не кожа: глаз, бровей, волос, — чтобы они оставались чёткими рядом с гладкой кожей."
Beautify.Glow="Сияние"
Beautify.Glow.Tooltip="Добавляет мягкое свечение в светлых местах кожи."
Beautify.MaskSoftness="Мягкость маски"
Beautify.MaskSoftness.Tooltip="Насколько далёкие от измеренного цвета кожи оттенки ещё считаются кожей на лицах, которые обрабатывает ретушь. Меньше — строже оставляет за маской то, что не цвета кожи, например бороду или очки; больше — ретуширует и их. Подобрать помогает «Показать маску»."
Beautify.DetailSize="Размер деталей"
Beautify.DetailSize.Tooltip="Какого размера детали выравнивает сглаживание, соразмерно каждому лицу. Больше — выравнивает и более крупные неровности, меньше — только поры и мелкие морщинки."
Beautify.ShowMask="Показать маску"
Beautify.ShowMask.Tooltip="Подсвечивает цветом то, что обрабатывает ретушь, поверх затемнённой картинки: лица, за которыми она следит, без глаз, бровей и губ. Выключите перед эфиром."
Beautify.SaveStyle="Сохранить как набор..."
Beautify.SaveStyle.Tooltip="Сохраняет расширенные значения как ваш собственный набор — для всех фильтров ретуши."
Beautify.SaveStyle.Title="Сохранить набор"
Beautify.SaveStyle.Name="Название набора:"
Beautify.SaveStyle.Taken="«%1» — название встроенного набора. Выберите другое."
Beautify.DeleteStyle="Удалить набор"
Beautify.DeleteStyle.Tooltip="Удаляет выбранный ваш набор. Фильтры, которые его используют, сохранят свои значения."
Beautify.DeleteStyle.Question="Удалить набор «%1»?"
Dock.Beauty="Красота"
Dock.Beauty.Tooltip="Сглаживает кожу фильтром «Ретушь кожи» в OBS, только на этом источнике. Набор задаёт, как, ползунок — насколько сильно; глаза, брови, губы, волосы и фон остаются чёткими."
Dock.Beauty.Add="Добавить ретушь"
Dock.Beauty.Add.Tooltip="Добавляет фильтр «Ретушь кожи» к этому источнику с набором «Естественный». Он появится и в фильтрах источника, где его можно удалить."
Dock.Beauty.Added="Ретушь добавлена к «%1»."
Dock.Beauty.On.Tooltip="Включает и выключает ретушь для этого источника. Выключенная, она оставляет картинку как есть и ничего не стоит."
