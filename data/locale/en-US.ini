Plugin.Name="iPhone Camera"
Plugin.Description="Turns an iPhone running Blackmagic Camera into a camera for OBS, with every camera setting in a dock."
Camera.Name="iPhone Camera"
Beautify.Name="Beautify"
Dock.Title="Camera Controls"
Dock.Empty="Add an iPhone with Tools → Add iPhone Camera..., then adjust its camera here."
Tools.AddCamera="Add iPhone Camera..."
Camera.Port="UDP port"
Camera.Port.Tooltip="The port on this computer that the phone sends its stream to. 0 picks a free one from 9710 up; each iPhone Camera needs its own."
Camera.Latency="SRT latency"
Camera.Latency.Tooltip="How long the stream waits for lost packets to arrive again. Raise it if the picture breaks up on busy Wi-Fi; lower it for less delay."
Camera.HardwareDecoding="Hardware decoding"
Camera.HardwareDecoding.Tooltip="Decodes the video on the graphics chip, which saves processor time. Turn it off only if the picture shows errors."
Camera.Address="iPhone address"
Camera.Address.Tooltip="The phone's IP address on the network, for example 192.168.1.23. The iPhone shows it under Settings → Wi-Fi → ⓘ next to the network."
Camera.Preset="Stream preset"
Camera.Preset.Tooltip="Sets the camera's video format and the stream's quality in one choice. It also sets the phone's own recording format."
Preset.1080p60High="best for most streams"
Preset.1080p60Balanced="for busier Wi-Fi"
Preset.1080p30="for weak Wi-Fi"
Preset.720p60="smallest, for the weakest connections"
Preset.4K30="sharper; about 0.2 s more delay; needs strong 5 GHz Wi-Fi and hardware HEVC decoding"
Preset.4K60="sharpest; about 0.2 s more delay; needs strong 5 GHz Wi-Fi and hardware HEVC decoding"
Status.NoPhone="Enter the iPhone's address below."
Status.Connecting="Connecting..."
Status.Starting="Starting the camera..."
Status.Live="Live"
Status.Paused="Paused while hidden"
Status.NotAnswering="Blackmagic Camera isn't answering. Open the app on the phone and keep it on screen, and keep the phone and this computer on the same network."
Status.MonitorOnly="Blackmagic Camera only allows monitoring. In the app, set Settings → Remote Camera Control → Camera Available for to Control and Monitor."
Status.CannotReach="The phone can't reach OBS. Allow OBS in the firewall, and keep the phone and computer on the same network, not a guest network."
Status.Unavailable="The phone can't stream right now"
Status.Refused="Blackmagic Camera did not accept the stream setup. Update the app to version 3.4 or newer."
Status.FFmpeg="This build of obs-bmagicam is not made for this version of OBS. Install the obs-bmagicam release for it."
