Beautify.Name="Beautify"
Beautify.Style="Style"
Beautify.Style.Tooltip="A set of all the advanced values: Natural keeps skin real, Soft smooths more and adds a little glow, Glam is the strongest. The Beauty slider sets how strongly it applies."
Beautify.Style.natural="Natural"
Beautify.Style.soft="Soft"
Beautify.Style.glam="Glam"
Beautify.Style.Custom="Custom"
Beautify.Strength="Beauty"
Beautify.Strength.Tooltip="How strongly the style applies to skin. The first half of the slider stays natural, the top reaches the full style. 0 turns Beautify off and leaves the picture exactly as it was."
Beautify.Advanced="Advanced settings"
Beautify.Advanced.Tooltip="Shows the values the style is made of. Moving one makes the style Custom; Save as style keeps it."
Beautify.Smoothing="Smoothing"
Beautify.Smoothing.Tooltip="Flattens small unevenness of the skin, such as pores, fine lines and blemishes. Large detail such as lashes, nostrils and the lip line stays."
Beautify.Texture="Texture"
Beautify.Texture.Tooltip="Keeps the skin's finest grain on smoothed skin, so it never looks plastic. Higher keeps more."
Beautify.Evening="Tone evening"
Beautify.Evening.Tooltip="Lifts small dark spots and evens redness towards the surrounding skin."
Beautify.Sharpen="Sharpening"
Beautify.Sharpen.Tooltip="Sharpens what is not skin, such as eyes, brows and hair, so they stay crisp next to smooth skin."
Beautify.Glow="Glow"
Beautify.Glow.Tooltip="Adds a soft bloom to the skin's highlights."
Beautify.MaskSoftness="Mask softness"
Beautify.MaskSoftness.Tooltip="How far from the measured skin color still counts as skin, and how softly the retouching fades out at the mask's edge. Higher takes in more; lower keeps lips and similar colors in the background out more strictly. Show mask helps to set it."
Beautify.DetailSize="Detail size"
Beautify.DetailSize.Tooltip="How large the detail is that smoothing flattens. Higher for close-ups, lower for wide shots."
Beautify.ShowMask="Show mask"
Beautify.ShowMask.Tooltip="Colors what Beautify treats as skin, over a dimmed picture. Turn it off again before going live."
Beautify.SaveStyle="Save as style..."
Beautify.SaveStyle.Tooltip="Saves the advanced values as a style of your own, for every Beautify filter."
Beautify.SaveStyle.Title="Save style"
Beautify.SaveStyle.Name="Name of the style:"
Beautify.SaveStyle.Taken="%1 is the name of a built-in style. Choose another name."
