Wizard.Prepare.Steps="1. Install Blackmagic Camera from the App Store and open it.\n2. Turn on its HTTP server: tap Settings, then HTTP Server, then turn on Enable HTTP Server.\n3. When iOS asks, allow Blackmagic Camera to find devices on your local network.\n4. Keep the app open on screen while you stream, and set Auto-Lock to Never in iPhone Settings → Display & Brightness. A charger keeps a long stream going."
